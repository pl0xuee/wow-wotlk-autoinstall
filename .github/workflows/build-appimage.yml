name: Build AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job opts into exactly what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      # Warnings are errors here rather than in the csproj, so a local build stays workable
      # while CI still refuses to let one land on main.
      - name: Build
        run: dotnet build --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  appimage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Provenance attestation: proves this AppImage was built by this workflow from this
      # commit, and lets anyone verify it with `gh attestation verify`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AppImage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          chmod +x scripts/build-appimage.sh packaging/WowWotlkAutoinstall.AppDir/AppRun
          scripts/build-appimage.sh

      # Skipped for pull requests from forks: GitHub withholds the id-token there, so the step
      # can only fail, and a red X on every outside contributor's PR teaches people to ignore
      # CI. Releases are built from tags on this repo, where the token is available.
      - name: Attest build provenance
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.1.1
        with:
          subject-path: WowWotlkAutoinstall-x86_64.AppImage

      - name: Checksum
        run: sha256sum WowWotlkAutoinstall-x86_64.AppImage | tee SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WowWotlkAutoinstall-x86_64
          path: |
            WowWotlkAutoinstall-x86_64.AppImage
            SHA256SUMS
          # Already a compressed squashfs image; zipping it again only costs time.
          compression-level: 0

  # Separate job so write permission is granted only for tag builds that publish a release.
  release:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WowWotlkAutoinstall-x86_64

      - name: Extract changelog for this tag
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Pull the section between this version's heading and the next "## " heading.
          notes="$(awk -v tag="## $tag" '
            $0 == tag {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            echo "No CHANGELOG.md section for $tag; falling back to auto-generated notes." >&2
            echo "have_notes=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "notes<<EOF"
              echo "$notes"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            echo "have_notes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            WowWotlkAutoinstall-x86_64.AppImage
            SHA256SUMS
          body: ${{ steps.changelog.outputs.have_notes == 'true' && steps.changelog.outputs.notes || '' }}
          generate_release_notes: ${{ steps.changelog.outputs.have_notes != 'true' }}
